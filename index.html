<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Arrow Removal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
  }
  #hud {
    color: #7070aa;
    font: 600 13px/1 sans-serif;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    gap: 20px;
  }
  #hud span { color: #a0a0cc; }
  canvas { display: block; border-radius: 6px; }
</style>
</head>
<body>
<div id="hud">
  Remaining: <span id="left">0</span>
</div>
<canvas id="c"></canvas>

<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const ROWS = 14, COLS = 9;

// ─── Level generator: onion rings ────────────────────────────────────────────
// Outer ring arrows point outward → immediately removable.
// Each inner ring unlocks after the ring around it is cleared.
function makeLevel(rows, cols) {
  const g = Array.from({length: rows}, () => Array(cols).fill(null));
  const rings = Math.floor(Math.min(rows, cols) / 2);

  for (let k = 0; k < rings; k++) {
    const t = k, b = rows - 1 - k, l = k, r = cols - 1 - k;

    // Top & bottom edges
    for (let c = l; c <= r; c++) { g[t][c] = 'U';  g[b][c] = 'D'; }

    if (l === r) {
      // Single-column remainder: split vertically
      for (let row = t + 1; row <= Math.floor((t + b) / 2); row++) g[row][l] = 'U';
      for (let row = Math.floor((t + b) / 2) + 1; row < b;   row++) g[row][l] = 'D';
    } else {
      // Left & right edges
      for (let row = t + 1; row < b; row++) { g[row][l] = 'L';  g[row][r] = 'R'; }
    }
  }

  // Odd-row center strip (when rows is odd and cols is even)
  if (rows % 2 === 1) {
    const cr = rows >> 1;
    for (let c = 0; c < cols; c++)
      if (!g[cr][c]) g[cr][c] = c < (cols >> 1) ? 'L' : 'R';
  }

  return g;
}

// ─── State ───────────────────────────────────────────────────────────────────
let dirs    = makeLevel(ROWS, COLS);
let removed = Array.from({length: ROWS}, () => Array(COLS).fill(false));
let won     = false;

// Animation
let anim    = null;   // { path:[[r,c],...], dir:'U'|'D'|'L'|'R', progress:0..1 }
let flash   = null;   // { r, c, until: timestamp }
let lastTs  = null;
const ANIM_MS = 420;

// ─── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const hudLeft = document.getElementById('left');

function resize() {
  const pad  = 12;
  const hudH = document.getElementById('hud').offsetHeight + 10;
  const avW  = window.innerWidth  - pad * 2;
  const avH  = window.innerHeight - pad * 2 - hudLeft.offsetHeight - 20;
  const aspect = COLS / ROWS;
  let w = Math.min(avW, avH * aspect);
  let h = w / aspect;
  if (h > avH) { h = avH; w = h * aspect; }
  canvas.width  = Math.floor(w);
  canvas.height = Math.floor(h);
}
window.addEventListener('resize', () => { resize(); });
resize();

// ─── Game logic ───────────────────────────────────────────────────────────────
const DR = { U:-1, D:1, L:0,  R:0  };
const DC = { U:0,  D:0, L:-1, R:1  };

function pathAhead(r, c) {
  const d = dirs[r][c];
  const path = [];
  let nr = r + DR[d], nc = c + DC[d];
  while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
    path.push([nr, nc]);
    nr += DR[d]; nc += DC[d];
  }
  return path;
}

function canRemove(r, c) {
  if (!dirs[r][c] || removed[r][c]) return false;
  return pathAhead(r, c).every(([nr, nc]) => !dirs[nr][nc] || removed[nr][nc]);
}

function countLeft() {
  let n = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (dirs[r][c] && !removed[r][c]) n++;
  return n;
}

function checkWon() {
  return countLeft() === 0;
}

// ─── Colours ──────────────────────────────────────────────────────────────────
const C = {
  bg:      '#0d0d1a',
  cell:    '#16162e',
  cellAlt: '#191932',
  arrow:   '#9898cc',
  dot:     '#22223a',
  invalid: '#cc3333',
  slither: '#3a6fff',
  win:     '#44ffaa',
  winSub:  '#7070aa',
};

// ─── Render ───────────────────────────────────────────────────────────────────
function draw() {
  const W = canvas.width, H = canvas.height;
  const cw = W / COLS, ch = H / ROWS;
  const now = Date.now();

  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  const gap = 2;

  // Cells
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? C.cell : C.cellAlt;
      ctx.fillRect(c * cw + gap, r * ch + gap, cw - gap, ch - gap);
    }
  }

  const sw = Math.min(cw, ch) * 0.095;

  // Arrows & dots
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!dirs[r][c]) continue;
      const cx = c * cw + cw / 2;
      const cy = r * ch + ch / 2;
      const isSlitherOrigin = anim && anim.path[0][0] === r && anim.path[0][1] === c;

      if (removed[r][c] && !isSlitherOrigin) {
        ctx.fillStyle = C.dot;
        ctx.beginPath();
        ctx.arc(cx, cy, Math.min(cw, ch) * 0.085, 0, Math.PI * 2);
        ctx.fill();
      } else if (!removed[r][c]) {
        const isInvalid = flash && flash.r === r && flash.c === c && now < flash.until;
        drawArrow(cx, cy, dirs[r][c], cw, ch, sw, isInvalid ? C.invalid : C.arrow);
      }
    }
  }

  // Slither animation
  if (anim) {
    const { path, dir, progress } = anim;
    const n = path.length;
    const cp = progress * n;
    const hi = Math.min(Math.floor(cp), n - 1);
    const frac = cp - hi;

    // Fading trail
    for (let i = 0; i <= hi; i++) {
      const [pr, pc] = path[i];
      const alpha = (1 - i / n) * 0.65;
      ctx.fillStyle = `rgba(58,111,255,${alpha.toFixed(2)})`;
      ctx.fillRect(pc * cw + gap, pr * ch + gap, cw - gap, ch - gap);
    }

    // Moving arrowhead
    const [hr, hc] = path[hi];
    let hx = hc * cw + cw / 2, hy = hr * ch + ch / 2;
    if (hi + 1 < n) {
      const [nr, nc] = path[hi + 1];
      hx += (nc * cw + cw / 2 - hx) * frac;
      hy += (nr * ch + ch / 2 - hy) * frac;
    }
    drawArrow(hx, hy, dir, cw, ch, sw, C.slither);
  }

  // Win overlay
  if (won) {
    ctx.fillStyle = 'rgba(13,13,26,0.90)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = C.win;
    ctx.font = `bold ${Math.round(W * 0.10)}px sans-serif`;
    ctx.fillText('All Cleared!', W / 2, H * 0.44);

    ctx.fillStyle = C.winSub;
    ctx.font = `${Math.round(W * 0.042)}px sans-serif`;
    ctx.fillText('Tap to play again', W / 2, H * 0.54);
  }

  hudLeft.textContent = countLeft();
}

function drawArrow(cx, cy, dir, cw, ch, sw, color) {
  const sz   = Math.min(cw, ch);
  const len  = sz * 0.50;
  const head = sz * 0.19;
  const spread = 0.62;
  const angle = { R: 0, D: Math.PI / 2, L: Math.PI, U: -Math.PI / 2 }[dir];

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.strokeStyle = color;
  ctx.lineWidth = sw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Shaft
  ctx.beginPath(); ctx.moveTo(-len / 2, 0); ctx.lineTo(len / 2, 0); ctx.stroke();
  // Head upper
  ctx.beginPath(); ctx.moveTo(len / 2, 0); ctx.lineTo(len / 2 - head, -head * spread); ctx.stroke();
  // Head lower
  ctx.beginPath(); ctx.moveTo(len / 2, 0); ctx.lineTo(len / 2 - head, head * spread); ctx.stroke();

  ctx.restore();
}

// ─── Animation loop ───────────────────────────────────────────────────────────
function loop(ts) {
  requestAnimationFrame(loop);
  if (anim) {
    if (!lastTs) lastTs = ts;
    anim.progress = Math.min(1, anim.progress + (ts - lastTs) / ANIM_MS);
    lastTs = ts;
    if (anim.progress >= 1) {
      anim = null;
      lastTs = null;
      if (checkWon()) won = true;
    }
  }
  draw();
}
requestAnimationFrame(loop);

// ─── Input ────────────────────────────────────────────────────────────────────
function tap(px, py) {
  if (anim) return;

  if (won) {
    dirs    = makeLevel(ROWS, COLS);
    removed = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    won     = false;
    return;
  }

  const cw = canvas.width / COLS, ch = canvas.height / ROWS;
  const c  = Math.floor(px / cw);
  const r  = Math.floor(py / ch);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
  if (!dirs[r][c] || removed[r][c]) return;

  if (!canRemove(r, c)) {
    flash = { r, c, until: Date.now() + 380 };
    return;
  }

  const path = [[r, c], ...pathAhead(r, c)];
  const dir  = dirs[r][c];
  removed[r][c] = true;
  anim = { path, dir, progress: 0 };
  lastTs = null;
}

function canvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return [
    (clientX - rect.left)  * canvas.width  / rect.width,
    (clientY - rect.top)   * canvas.height / rect.height,
  ];
}

canvas.addEventListener('click', e => {
  tap(...canvasCoords(e.clientX, e.clientY));
});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  tap(...canvasCoords(t.clientX, t.clientY));
}, { passive: false });
</script>
</body>
</html>
